version: 1
project:
  root: .
  stacks: [node, typescript]
  package_managers: [bun]
  monorepo: false
  signals: [package.json, tests, targets]
sdd:
  artifact_store: 02-DOCS/wiki/sdd
  execution_mode: interactive
  discovered_skills: null  # OMP discovers skills natively
  review_budget:
    line_budget: 400
    file_budget: 12
  delivery_strategy:
    default: ask-on-risk
testing:
  strict_tdd: true
  runners: [node:test, bun:test]
  commands:
    apply:
      - node --test tests/*.test.js
    verify:
      - node --test tests/*.test.js && bun tests/adapter.test.ts
phase_rules:
  proposal: optional-on-ambiguity
  specify: requires intent or proposal
  plan: requires spec
  tasks: requires plan and spec
  analyze: requires spec plan tasks
  implement: requires analyze pass, strict_tdd when testing.strict_tdd is true
  verify: requires spec tasks evidence
  archive: requires verify record and review/ship outcome
models:
  enabled: false
  provider: anthropic
  tiers:
    heavy: claude-opus-4-8
    balanced: claude-sonnet-4-6
    light: claude-haiku-4-5-20251001
  phases:
    constitution: heavy
    specify: balanced
    clarify: balanced
    plan: heavy
    tasks: balanced
    analyze: heavy
    implement: balanced
    verify: balanced
    review: heavy
    ship: light
    debug: heavy
    worktrees: light
    sdd-init: light
  overrides: {}
